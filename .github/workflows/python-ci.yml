name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check .

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax of core modules
        run: |
          python -m py_compile src/transcribe.py
          python -m py_compile src/youtube_transcribe.py
          python -m py_compile src/download_model.py
          python -m py_compile src/urdu_correction.py
          python -m py_compile src/setup_env.py
          python -m py_compile src/utils/audio_splitter.py
